# Publishes GitHub releases (the install path for WowUp and manual users) and,
# separately and optionally, CurseForge.
#
# Trust boundaries:
#   * meta            — resolves version/type from a tag or input, no checkout
#   * verify          — no secrets, contents:read, one pinned action
#   * github-release  — contents:write, no secrets at all, runs on tags
#   * curseforge      — opt-in per run, environment-gated, token in one step
#
# A CurseForge failure cannot break a GitHub release: they are separate jobs
# with no dependency between them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 11.0.4-forever.2 (ignored on a tag push)"
        required: false
        default: ""
      release_type:
        description: "CurseForge release type"
        type: choice
        options: [alpha, beta, release]
        default: alpha
      publish_curseforge:
        description: "Also upload to CurseForge (needs approval + token)"
        type: boolean
        default: false
      manual_release:
        description: "CurseForge: keep the file held for manual release"
        type: boolean
        default: true
      dry_run:
        description: "Build, audit and print metadata; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_type: ${{ steps.v.outputs.release_type }}
    steps:
      - name: Resolve version and release type
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TYPE: ${{ inputs.release_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="${REF_NAME#v}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::no version: tag it, or pass one"
            exit 1
          fi
          if [ -n "${INPUT_TYPE}" ]; then
            release_type="${INPUT_TYPE}"
          elif [[ "${REF_NAME}" == *-beta* ]]; then
            release_type=beta
          else
            release_type=release
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "resolved ${version} as ${release_type}"

  verify:
    needs: meta
    if: github.repository == 'felippeb/adibuttonauras-forever'
    uses: ./.github/workflows/_verify.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      dry_run: ${{ inputs.dry_run || false }}

  # The primary distribution path. No secrets, no environment, no waiting.
  github-release:
    needs: [meta, verify]
    if: |
      github.repository == 'felippeb/adibuttonauras-forever' &&
      github.event_name == 'push' &&
      inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: pwsh -NoProfile -NonInteractive -File ./build-zip.ps1 -Version "$VERSION" -OutDir release

      - name: Audit archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python3 tools/audit_zip.py --file "release/AdiButtonAuras-$VERSION.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "release/AdiButtonAuras-$VERSION.zip" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes

  curseforge:
    needs: [meta, verify]
    if: |
      github.repository == 'felippeb/adibuttonauras-forever' &&
      inputs.publish_curseforge == true &&
      inputs.dry_run != true &&
      vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: curseforge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: pwsh -NoProfile -NonInteractive -File ./build-zip.ps1 -Version "$VERSION" -OutDir release

      - name: Audit archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python3 tools/audit_zip.py --file "release/AdiButtonAuras-$VERSION.zip"

      - name: Publish to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
          CF_GAME_VERSION_NAME: ${{ vars.CF_GAME_VERSION_NAME || '1.60.1' }}
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_TYPE: ${{ needs.meta.outputs.release_type }}
          MANUAL: ${{ inputs.manual_release }}
        run: |
          set -euo pipefail
          args=(--file "release/AdiButtonAuras-$VERSION.zip"
                --version "$VERSION"
                --release-type "$RELEASE_TYPE")
          if [ "${MANUAL}" = "true" ]; then
            args+=(--manual-release)
          fi
          python3 tools/cf_release.py "${args[@]}"
