version: 2

updates:
  # The only third-party code in the release path is the checkout action.
  # Dependabot proposes new commit pins; the SHA stays explicit in the workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
